{{ define "main" }}

<article class="page-single">
    <div class="container">
        <!-- Page Header -->
        <header class="page-header">
            <h1 class="page-title">{{ .Title }}</h1>
            {{ if .Params.subtitle }}
            <p class="page-subtitle">{{ .Params.subtitle }}</p>
            {{ end }}
        </header>

        <!-- Page Content -->
        <div class="page-content">
            {{ .Content }}
        </div>
    </div>
</article>

{{ end }}
